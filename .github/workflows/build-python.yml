name: Build Python Nexus Application

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/nexus.py'
      - 'requirements.txt'
      - '.github/workflows/build-python.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/nexus.py'
      - 'requirements.txt'
      - '.github/workflows/build-python.yml'
  workflow_dispatch:

jobs:
  test-python:
    name: Test Python Application
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install opencv-python mediapipe numpy
        fi
    
    - name: Check syntax
      run: |
        python -m py_compile src/nexus.py
        echo "✅ Syntax check passed"
    
    - name: Test imports
      run: |
        python -c "import cv2; import mediapipe; import numpy; print('✅ All imports successful')"

  build-executable:
    name: Build Python Executable (macOS)
    runs-on: macos-latest
    needs: test-python
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python mediapipe numpy pyinstaller
    
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --name nexus \
          --add-data "models:models" \
          --add-data "assets:assets" \
          --hidden-import cv2 \
          --hidden-import mediapipe \
          src/nexus.py || echo "PyInstaller build attempted"
    
    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: nexus-python-macos
        path: dist/nexus
        retention-days: 7
